openapi: 3.0.0
info:
  title: 1447.tbcv_sofk-commonApi-s-rest-v1
  version: 1.0.0
  description: Методы и модели для работы с API СОФК
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: affiliates-add-controller
    description: Методы работы с клиентами персональных менеджеров
paths:
  /ext/affiliate/add:
    post:
      description: добавление клиента в список аффилированных лиц
      operationId: add_affiliate
      tags:
        - affiliates-add-controller
      requestBody:
        description: Параметры добавляемого клиента
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateAddRequestParamsExt'
      responses:
        "200":
          description: Добавленный клиент
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCustomerExt'
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "404":
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "422":
          description: У клиента нет аффилированных лиц
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
components:
  schemas:
    AffiliateCustomerExt:
      type: object
      description: Описание аффилированного лица
      additionalProperties: false
      required:
        - mdmId
        - relativeName
      properties:
        mdmId:
          type: string
          description: Идентификатор клиента
          minLength: 1
          maxLength: 20
          example: '1401382340'
        lastName:
          type: string
          description: Фамилия
          minLength: 0
          maxLength: 50
          example: Галеева
        firstName:
          type: string
          description: Имя
          minLength: 0
          maxLength: 50
          example: Ирина
        middleName:
          type: string
          description: Отчество
          minLength: 0
          maxLength: 50
          example: Яковлевна
        birthDate:
          type: string
          minLength: 10
          maxLength: 10
          description: День Рождения
          pattern: '^[0-9]{4}-((0[1-9])|(1[0-2]))-((0[1-9])|(1[0-9])|(2[0-9])|(3[0-1]))$'
        relativeName:
          type: string
          description: Наименование степени родства
          maxLength: 25
        specificRelation:
          type: string
          description: Другое наименование семейного родства аффилированного лица
          maxLength: 25
    AffiliateAddRequestParamsExt:
      type: object
      description: Парамерты добавляемого аффилированного лица
      additionalProperties: false
      required:
        - masterMdmId
        - affiliateMdmId
        - relativeId
      properties:
        masterMdmId:
          type: string
          description: Код Mdm клиента
          minLength: 1
          maxLength: 40
        affiliateMdmId:
          type: string
          description: Код Mdm аффилированного лица
          minLength: 1
          maxLength: 40
        relativeId:
          type: integer
          format: int64
          description: Идентификатор семейного родства аффилированного лица
          minimum: 1
          maximum: 9223372036854775807
        specificRelation:
          type: string
          description: Другое наименование семейного родства аффилированного лица
          maxLength: 25
    SofkErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: 'date-time'
          description: Время ответа
          
        status:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          description: URN ответа
          maxLength: 100
          example: /employee/by-login/12342123