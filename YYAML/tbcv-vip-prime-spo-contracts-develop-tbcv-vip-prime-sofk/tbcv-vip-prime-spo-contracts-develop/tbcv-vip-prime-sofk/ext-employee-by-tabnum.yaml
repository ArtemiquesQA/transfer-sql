openapi: 3.0.0
info:
  title: 1447.tbcv_sofk-commonApi-s-rest-v1
  version: 1.0.0
  description: Методы и модели для работы с API СОФК
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
    - name: employee-controller
      description: Методы работы с сотрудниками
paths:
  /ext/employee/by-tabnum/{tabnum}:
    get:
      description: Информация о сотруднике по табельному номеру
      operationId: get_employee_by_tab_num
      tags:
        - employee-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
        - name: tabnum
          in: path
          required: true
          description: Табельный номер сотрудника
          schema:
            type: string
            minLength: 1
            maxLength: 50
      responses:
        "200":
          description: Информация о сотруднике
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeInfo'
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "404":
          description: Сотрудник не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
components:
  schemas:
    EmployeeInfo:
      type: object
      description: Информация о сотруднике
      additionalProperties: false
      required:
        - orgId
        - roles
        - isSupervisor
      properties:
        orgId:
          type: string
          description: Номер отделения
          minLength: 1
          maxLength: 50
          example: '50216613'
        lastName:
          type: string
          description: Фамилия
          minLength: 0
          maxLength: 50
          example: Марков
        firstName:
          type: string
          description: Имя
          minLength: 0
          maxLength: 50
          example: Андрей
        middleName:
          type: string
          description: Отчество
          minLength: 0
          maxLength: 50
          example: Викторович
        roles:
          type: array
          description: Доступные роли сотрудника
          minItems: 0
          maxItems: 10
          items:
            $ref: '#/components/schemas/ServiceTeamRole'
        isSupervisor:
          type: boolean
          description: Является ли сотрудник супервизором его ТП
    ServiceTeamRole:
      type: string
      description: Роль сотрудника в команде обслуживания
      enum:
        - SUPERVISOR
        - SUPERVISOR_PRIME
        - PERSONAL_MANAGER
        - PFM
        - PFM2
        - ACCOUNT_MANAGER
        - ACCOUNT_MANAGER_PRIVILEGE
    SofkErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: 'date-time'
          description: Время ответа
          
        status:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          description: URN ответа
          maxLength: 100
          example: /employee/by-login/12342123