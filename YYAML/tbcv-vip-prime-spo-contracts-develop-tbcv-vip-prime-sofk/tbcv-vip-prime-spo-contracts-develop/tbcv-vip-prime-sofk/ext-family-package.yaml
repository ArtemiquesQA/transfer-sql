openapi: 3.0.0
info:
  title: 1447.tbcv-getFamilyCircleClientsByMdmId-s-rest-v1
  version: 1.0.0
  description: Методы и модели для работы с API СОФК
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: family-package-controller
    description: Получить информацию о связанных через ПУ Семейный по mdmId клиента
paths:
  /ext/familyCircle/{mdmId}:
    get:
      description: Получить информацию о связанных через ПУ Семейный по mdmId клиента
      operationId: get_family_package_by_master_customer
      tags:
        - family-package-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
        - name: mdmId
          in: path
          required: true
          description: Идентификатор клиента
          schema:
            type: string
            minLength: 1
            maxLength: 19
      responses:
        "200":
          description: Массив с информацией по лицам связанным через ПУ Семейный
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtFamilyPackageClient'
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "404":
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "422":
          description: У клиента нет аффилированных лиц
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
components:
  schemas:
    ExtFamilyPackageClient:
      type: object
      description: Запись о клиенте связанному по ПУ Семейный
      required:
        - mdmId
      additionalProperties: false
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 19
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
        birthDate:
          type: string
          format: date
        relation:
          type: string
          description: Наименование семейного родства
          maxLength: 25
    SofkErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: 'date-time'
          description: Время ответа
        status:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          description: URN ответа
          maxLength: 100
          example: /employee/by-login/12342123