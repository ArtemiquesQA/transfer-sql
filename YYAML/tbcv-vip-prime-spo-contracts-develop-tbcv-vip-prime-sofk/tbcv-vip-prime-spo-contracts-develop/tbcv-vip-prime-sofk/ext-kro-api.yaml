openapi: 3.0.0
info:
  title: 1447.tbcv_sofkKroApi-s-rest-v1
  version: 1.0.0
  description: Методы и модели для работы с КРО из API СОФК
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: ext-serviceteam-controller
    description: Методы работы с командой обслуживания клиента
  - name: ext-customer-card-access-by-login-controller
    description: >-
      Методы для предоставления сотруднику доступа без верификации к карточке
      клиента
paths:
  /ext/client/serviceteam:
    post:
      description: Получение команды обслуживания клиента
      operationId: get_client_service_team
      tags:
        - ext-serviceteam-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Параметры запроса для получения команды обслуживания клиента
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientServiceTeamRequestParams'
      responses:
        '200':
          description: Команда обслуживания клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceTeamResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        '422':
          description: Команда обслуживания не назначена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
  /ext/client/serviceteam/history/list:
    post:
      description: Получение истории изменения команды обслуживания клиента
      operationId: get_client_service_team_history
      tags:
        - ext-serviceteam-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающего данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: >-
          Параметры запроса для получения истории изменения команды обслуживания
          клиента
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientServiceTeamHistoryRequestParams'
      responses:
        '200':
          description: История изменений в команде обслуживания
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientServiceTeamHistoryEventList'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
  /ext/client/card/access/by-login:
    post:
      description: Предоставить для сотрудника безверификационный доступ к клиенту
      operationId: set_client_card_access
      tags:
        - ext-customer-card-access-by-login-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Параметры запроса для получения доступа без верификации
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCardAccessRequestParams'
      responses:
        '201':
          description: Безверификационный доступ успешно предоставлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardAccessByLoginResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
  /ext/kro/operation/members:
    post:
      description: Получение ФИО сотруднников участвующих в КРО
      operationId: get_kro_members
      tags:
        - ext-kro-members-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Параметры запроса для получения ФИО участников КРО
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                $ref: '#/components/schemas/KroMembersRequestParams'
      responses:
        '200':
          description: ФИО участников КРО
          content:
            application/json:
              schema:
                type: array
                description: Записи об участниках КРО
                maxItems: 100
                items:
                  $ref: '#/components/schemas/KroMembersResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
components:
  schemas:
    SofkErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: date-time
          description: Время ответа
        status:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          description: URN ответа
          maxLength: 100
          example: /employee/by-login/12342123
    ClientServiceTeamRequestParams:
      type: object
      description: Входные параметры для запроса команды обслуживания клиента
      additionalProperties: false
      required:
        - mdmId
        - needActualization
      properties:
        mdmId:
          type: string
          description: mdmId клиента
          maxLength: 19
        needActualization:
          type: boolean
          description: >-
            Признак необходимости актуализации ПУ клиента и его КО в 1503
            Продуктовый профиль ФЛ
    ServiceTeamResponseParams:
      type: object
      description: Запись о клиенте
      required:
        - customer
        - servicePack
        - isVip
        - isTop
        - isExOb
        - isSuperVip
        - team
        - serviceGroup
      additionalProperties: false
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        servicePack:
          $ref: '#/components/schemas/ServicePack'
        isVip:
          type: boolean
          description: Метка VIP
        isTop:
          type: boolean
          description: Метка TOP
        team:
          type: array
          description: Команда обслуживания
          maxItems: 20
          items:
            $ref: '#/components/schemas/TeamMember'
        serviceGroup:
          $ref: '#/components/schemas/ServiceGroup'
        tempAgreementExpirationDate:
          type: string
          description: Дата окончания временного соглашения
          format: date
        isExOb:
          type: boolean
          description: Метка Открытие.Брокер
        isSuperVip:
          type: boolean
          description: Наличие метки SuperVip
        company:
          type: string
          description: Название организации
          maxLength: 255
    Customer:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      required:
        - mdmId
        - lastName
        - firstName
        - middleName
      properties:
        mdmId:
          type: string
          maxLength: 19
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
        birthDate:
          type: string
          format: date
    CustomerWithBranch:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      properties:
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
        branchExtCode:
          type: string
          maxLength: 50
          minLength: 0
          description: Точка закрепления клиента
          example: 8977
    EmployeeFio:
      type: object
      description: Описание одного сотрудника
      additionalProperties: false
      properties:
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
    EmployeeServiceTeam:
      type: object
      description: Описание одного сотрудника из КО
      additionalProperties: false
      required:
        - role
        - lastName
        - firstName
      properties:
        role:
          $ref: '#/components/schemas/ServiceTeamRole'
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
    CardAccessByLoginResponseParams:
      type: object
      description: Описание ответа на предоставление безверификационного доступа
      additionalProperties: false
      required:
        - customer
        - serviceTeam
      properties:
        customer:
          $ref: '#/components/schemas/CustomerWithBranch'
        serviceTeam:
          type: array
          description: Команда обслуживания
          maxItems: 20
          items:
            $ref: '#/components/schemas/EmployeeServiceTeam'
    ServicePack:
      type: object
      description: Пакет услуг
      additionalProperties: false
      properties:
        name:
          type: string
          description: Наименование пакета услуг
          maxLength: 50
        type:
          $ref: '#/components/schemas/ServicePackType'
    ServicePackType:
      type: string
      description: Типы пакетов услуг
      enum:
        - UNKNOWN
        - PRIME
        - RETAIL
        - PRIVILEGE
    TeamMember:
      type: object
      description: участник команды обслуживания
      required:
        - role
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/ServiceTeamRole'
        branch:
          $ref: '#/components/schemas/Branch'
        manager:
          $ref: '#/components/schemas/Employee'
        shift:
          $ref: '#/components/schemas/ShiftInfo'
    ServiceTeamRole:
      type: string
      description: Роль сотрудника
      enum:
        - PERSONAL_MANAGER
        - SUPERVISOR
        - SUPERVISOR_PRIME
        - PFM
        - PFM2
        - BILL_ACCOUNTANT
        - BILL_ACCOUNTANT_PRIVILEGE
    Branch:
      type: object
      description: Отделение
      additionalProperties: false
      properties:
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 100
    Employee:
      type: object
      description: Описание одного сотрудника
      additionalProperties: false
      required:
        - lastName
        - firstName
        - middleName
      properties:
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
        phoneNum:
          type: string
          maxLength: 40
        workPhoneNum:
          type: string
          maxLength: 40
        workPhoneExt:
          type: string
          maxLength: 20
    ShiftInfo:
      type: object
      description: Информация о смене (основной менеджер или замещение)
      required:
        - manager
      additionalProperties: false
      properties:
        manager:
          $ref: '#/components/schemas/Employee'
        shiftDateFrom:
          type: string
          format: date-time
        shiftDateTo:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 255
    ServiceGroup:
      type: object
      description: Группа обслуживания клиентов Прайм
      required:
        - kind
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          description: Номер группы
          minimum: -1
          maximum: 2147483647
        kind:
          $ref: '#/components/schemas/ServiceGroupKind'
    ServiceGroupKind:
      type: string
      description: Тип групп обслуживания клиентов Прайм
      enum:
        - UNASSIGNED
        - PRIME
        - AFFILIATE
        - TEMPORARY_AGREEMENT
        - TOP_AFFLUENT
        - ELSE
    ClientCardAccessRequestParams:
      type: object
      description: Входные параметры для запроса доступа без верификации
      additionalProperties: false
      required:
        - mdmId
        - login
      properties:
        mdmId:
          type: string
          description: mdmId клиента по которому запрашивается доступ без верификации
          maxLength: 19
        login:
          type: string
          description: логин сотрудника которому запрашивается доступ без верификации
          maxLength: 50
    ClientServiceTeamHistoryRequestParams:
      type: object
      description: Параметры запроса списка истории
      required:
        - mdmId
        - page
        - pageSize
      additionalProperties: false
      properties:
        mdmId:
          type: string
          description: mdmId клиента
          maxLength: 19
        page:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        pageSize:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        sortRules:
          type: array
          maxItems: 2147483647
          items:
            $ref: '#/components/schemas/FieldSortRule'
    FieldSortRule:
      type: object
      description: Правило сортировки одного поля
      required:
        - fieldName
      additionalProperties: false
      properties:
        fieldName:
          type: string
          maxLength: 50
        direction:
          type: string
          enum:
            - asc
            - desc
    ClientServiceTeamHistoryEventList:
      type: object
      description: >-
        Информация для отображения экрана истории изменений в команде
        обслуживания клиента
      required:
        - list
      additionalProperties: false
      properties:
        list:
          type: array
          description: история изменений в команде обслуживания клиента
          maxItems: 2147483647
          items:
            $ref: '#/components/schemas/ClientServiceTeamHistoryEvent'
        aggregates:
          $ref: '#/components/schemas/ListAggregates'
    ClientServiceTeamHistoryEvent:
      type: object
      description: Запись об изменении в команде обслуживания клиента
      required:
        - datetime
        - type
        - comment
      additionalProperties: false
      properties:
        datetime:
          type: string
          format: date-time
          description: Дата
        type:
          type: string
          maxLength: 100
        comment:
          type: array
          maxItems: 2147483647
          items:
            $ref: '#/components/schemas/Pair'
        requester:
          type: object
          additionalProperties: false
          properties:
            employee:
              $ref: '#/components/schemas/Employee'
            branch:
              $ref: '#/components/schemas/Branch'
    ListAggregates:
      type: object
      description: Тотал данные о сформированном списке
      required:
        - total
      additionalProperties: false
      properties:
        total:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        sortableFields:
          type: array
          maxItems: 2147483647
          items:
            type: string
            maxLength: 50
    Pair:
      type: object
      description: Пара "Имя" - "Значение"
      required:
        - name
        - value
      additionalProperties: false
      properties:
        name:
          type: string
          description: Имя параметра
          maxLength: 100
        value:
          type: string
          description: Значение параметра
          maxLength: 255
    KroMembersRequestParams:
      type: object
      description: Входные параметры для запроса ФИО участников КРО
      additionalProperties: false
      required:
        - login
      properties:
        login:
          type: string
          description: Логин сотрудника
          maxLength: 50
    KroMembersResponseParams:
      type: object
      description: Запись об участниках КРО
      required:
        - login
        - employee
      additionalProperties: false
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeFio'
        login:
          type: string
          description: Логин сотрудника
          maxLength: 50
