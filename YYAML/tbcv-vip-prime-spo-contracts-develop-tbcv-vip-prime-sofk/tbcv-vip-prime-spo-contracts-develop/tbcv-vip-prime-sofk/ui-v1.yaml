                    minimum: 1
                    maximum: 9223372036854775807
              - name: directorsKind
                in: query
                required: false
                schema:
                    $ref: '#/components/schemas/DirectorsKind'
          responses:
              '200':
                  description: Группы сотрудников для заданного списка
                  content:
                      application/json:
                          schema:
                              type: array
                              description: Группы сотрудников для заданного списка
