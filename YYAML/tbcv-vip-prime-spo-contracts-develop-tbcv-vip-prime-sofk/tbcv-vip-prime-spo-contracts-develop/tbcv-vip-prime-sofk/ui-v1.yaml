      operationId: privilege_search_affiliates
      requestBody:
        description: Параметры поиска клиентов
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequestParams'
      responses:
        '200':
          description: список клиентов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliatesList'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
