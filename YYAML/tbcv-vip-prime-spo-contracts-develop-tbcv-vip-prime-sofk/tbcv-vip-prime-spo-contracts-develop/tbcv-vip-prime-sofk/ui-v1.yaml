components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
  schemas:
    MdmIdResponse:
      type: object
      description: mdm_id клиента
      additionalProperties: false
      required:
        - mdmId
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          minLength: 1
          maxLength: 19
    LeadCompanyList:
      type: object
      description: Ответ на запрос списка компаний по которым созданы лиды
      required:
        - list
        - aggregates
      additionalProperties: false
      properties:
        list:
          type: array
          description: Перечень компаний
          maxItems: 200
          items:
            $ref: '#/components/schemas/LeadCompany'
        aggregates:
          $ref: '#/components/schemas/ListAggregates'
    AppointedEmployee:
      type: object
      description: ФИО сотрудника
      additionalProperties: false
      required:
        - lastName
        - firstName
      properties:
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
    AffFamPackageClientPrime:
      type: object
      description: Список лиц связанных по ПУ Семейный
      properties:
        familyPackageClient:
          type: array
          description: Список клиентов связанных по ПУ Семейный
          maxItems: 2147483647
          items:
            $ref: '#/components/schemas/FamilyPackageClient'
    FamilyPackageClient:
      type: object
      description: Запись о клиенте связанному по ПУ Семейный
      required:
        - mdmId
      additionalProperties: false
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 19
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
        birthDate:
          type: string
          format: date
        relation:
          type: string
          description: Наименование семейного родства
          maxLength: 25
    FamilyPackageRequestParams:
      type: object
      description: Параметры поиска лиц связанных по ПУ семейный
      additionalProperties: false
      required:
        - customerId
      properties:
        customerId:
          type: integer
          format: int64
          description: Код клиента
          minimum: -1
          maximum: 9223372036854775807
    CustomerBranchReassignParams:
      type: object
      description: Параметры переназначения точки продаж портфеля
      required:
        - branchId
        - customerIds
      additionalProperties: false
      properties:
        branchId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        customerIds:
          type: array
          description: Массив идентификаторов клиентов для перезакреплений
          minItems: 1
          maxItems: 2000
          items:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
    ClientsServiceTeamListByFilterRequestParams:
      type: object
      description: Фильтр для запроса списка клиентов
      required:
        - manager
        - branchId
      additionalProperties: false
      properties:
        manager:
          $ref: '#/components/schemas/PersonalManager'
        branchId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Идентификатор точки продаж
        hasBillAccountManager:
          type: boolean
          description: Наличие МС
        hasShiftEmployee:
          type: boolean
          description: Наличие замещающего сотрудника
    DeletedEmployeeClientsListRequestParams:
      type: object
      description: Фильтр для запроса списка клиентов
      required:
        - employee
        - branchId
      additionalProperties: false
      properties:
        isTop:
          type: boolean
        isExOb:
          type: boolean
        isSuperVip:
          type: boolean
          description: Наличие метки SuperVip
        employee:
          $ref: '#/components/schemas/DeletedEmployee'
        branchId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Идентификатор точки продаж
        servicePackType:
          type: array
          description: Перечень типов ПУ для фильтрации
          minItems: 1
          maxItems: 4
          items:
            $ref: '#/components/schemas/ServicePackType'
        customerName:
          type: string
          maxLength: 160
          description: ФИО клиента для поиска
        rstGroupId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        includedCustomerIds:
          type: array
          description: Массив идентификаторов клиентов по которым нужно производить фильтрацию
          minItems: 1
          maxItems: 2000
          items:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
        excludedCustomerIds:
          type: array
          description: Массив идентификаторов клиентов, которые нужно исключить из списка для фильтрации
          minItems: 1
          maxItems: 2000
          items:
            type: integer
            format: int64
            minimum: 0
            maximum: 9223372036854775807
