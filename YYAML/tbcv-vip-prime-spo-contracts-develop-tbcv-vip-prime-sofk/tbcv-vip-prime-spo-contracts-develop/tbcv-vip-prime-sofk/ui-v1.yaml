          tags:
              - supervisor-controller
          parameters:
              - name: kind
                in: path
                required: true
                schema:
                    $ref: '#/components/schemas/SupervisorListKind'
              - name: rstGroupIds
                in: query
                required: false
                schema:
                    type: array
                    description: Массив айди групп ДКО
                    maxItems: 10
                    items:
                        type: integer
                        format: int64
                        minimum: 1
                        maximum: 9223372036854775807
              - name: cityId
                in: query
                required: false
                schema:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
              - name: branchId
