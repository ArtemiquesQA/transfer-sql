  /int/supervisor/filters/{kind}:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - supervisor-controller
      description: >-
        Получить возможное наполнение фильтров для экрана СВ Привилегии.
        Метод работает следующим способом: с фронта передаются все заполненные
        сотрудником фильтры и в параметре responseFilter указывается название
        фильтра, наполнение которого нужно получить.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SupervisorListKind'
      operationId: get-supervisor-customers-filters
      requestBody:
        description: Параметры запроса для получения возможных значений фильтров
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupervisorAndManagerFiltersRequestParams'
      responses:
        '200':
          description: Список возможных значений фильтра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorAndManagerFiltersResponsParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
