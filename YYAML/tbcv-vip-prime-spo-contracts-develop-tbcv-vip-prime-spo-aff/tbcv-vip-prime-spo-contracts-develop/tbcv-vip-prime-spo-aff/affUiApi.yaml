          schema:
            type: string
            maxLength: 40
      requestBody:
        description: Параметры запроса для обновления приглашения
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountInvitationRequestParams'
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountInvitationResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/card/check/widgets:
    post:
      security:
        - bearerAuth: []
      description: Определение премиальных виджетов для вывода в карточке близкого
      operationId: card_check_widgets
      tags:
        - customer-controller
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: mdmId близкого
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequestParams'
      responses:
        '200':
          description: Премиальные виджеты для вывода в карточке близкого
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamiliarCardWidgetsResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: {}
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
  parameters:
    X-MDM-ID:
      name: X-MDM-ID
      description: mdmId клиента
      in: header
      required: true
      schema:
        type: string
        maxLength: 40
  schemas:
    VtboUiErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: date-time
          description: Время ответа
          pattern: >-
            ^[0-9]{4}-((0[1-9])|(1[0-2]))-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(()|(.[0-9]{1,6})(Z|([+-](0[0-9]|1[0-2]):([0-5][0-9])))|(.[0-9]{1,6}))|)$
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          maxLength: 100
          description: URN ответа
          example: /api/v1/employee
    ClientRequestParams:
      type: object
      description: Параметры запроса по клиенту
      additionalProperties: false
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
    AffiiatesInFamily:
      type: object
      description: Наличие аффилированных лиц в Группе Близкие
      additionalProperties: false
      required:
        - affiiates
      properties:
        affiiates:
          type: array
          description: Список аффилированных лиц с условиями обслуживания
          maxItems: 200
          items:
            $ref: '#/components/schemas/AffiliatesId'
    AffiliatesId:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      required:
        - mdmId
        - customerId
        - isFamily
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        customerId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        isFamily:
          type: boolean
          description: Метка наличия клиента в Группе Близкие
    CustomerInfo:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      required:
        - lastName
        - firstName
      properties:
        customerId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
    InvitationInfoResponseParams:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      required:
        - masterInfo
      properties:
        externalId:
          type: string
          description: Иденификатор приглашения для внешних систем
          maxLength: 5
        masterInfo:
          $ref: '#/components/schemas/CustomerInfo'
    ServicePack:
      type: object
      description: Пакет услуг
      additionalProperties: false
      properties:
        name:
          type: string
          description: Наименование пакета услуг
          maxLength: 50
        type:
          $ref: '#/components/schemas/ServicePackType'
    ServicePackType:
      type: string
      description: Типы пакетов услуг
      enum:
        - UNKNOWN
        - PRIME
        - RETAIL
        - PRIVILEGE
    AffiliateCheck:
      type: object
      description: Возможность добавления аффилированного лица
      additionalProperties: false
      required:
        - isAllowed
      properties:
        isAllowed:
          type: boolean
          description: Результат проверки на возможность добавления аффилированного лица
        declineReason:
          type: string
          maxLength: 255
          example: Клиенту уже направлено приглашение в Близкий круг
          description: Причина невозможности добавления клиента как аффилированного лица
    InvitationAddRequestParams:
      type: object
      description: Параметры создания приглашения в Близкий круг
      additionalProperties: false
      required:
        - affiliateMdmId
        - familyInvitation
      properties:
        affiliateId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        affiliateMdmId:
          type: string
          description: Код Mdm клиента
          minLength: 1
          maxLength: 40
        familyInvitation:
          type: boolean
          description: Необходимость создания приглашения в Группе Близкие
    CountInvitationResponseParams:
      type: object
      description: Параметры ответа для запроса доступных приглашений в Близкий круг
      required:
        - isAllowed
      additionalProperties: false
      properties:
        isAllowed:
          type: boolean
          description: Флаг отражающий возможность добавить близкого
          default: true
        declineReason:
          type: string
          maxLength: 255
          example: Превышен лимит клиентов на добавление в Близкий круг
          description: Причина невозможности добавления клиента как аффилированного лица
        totalAff:
          type: integer
          description: Количество аффилированных лиц
          format: int32
          minimum: 0
          maximum: 2147483647
    AffilitesCounter:
      type: object
      additionalProperties: false
      properties:
        list:
          type: array
          description: Список значений матрицы добавления аффилированных лиц
          maxItems: 2147483647
          items:
            $ref: '#/components/schemas/AffilitesCounterNote'
    AffilitesCounterNote:
      type: object
      description: Описание одной записи из матрицы добалвения аффилированных лиц
      required:
        - affiliatesCount
      additionalProperties: false
      properties:
        minCurrentBalance:
          type: number
          description: Минимальное пороговое значение текущего остатка
          minimum: 0
          maximum: 9223372036854775807
          example: 10000000
        maxCurrentBalance:
          type: number
          description: Максимальное пороговое значение текущего остатка
          minimum: 0
          maximum: 9223372036854775807
          example: 15000000
        affiliatesCount:
          description: >-
            Максимальное количество аффилированных лиц для добавления в Близкий
            круг
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          example: 1
    InvitationAddResponseParams:
      type: object
      description: Параметры ответа для запроса добавления приглашения в Близкий круг
      additionalProperties: false
      properties:
        affiliateMdmId:
          type: string
          description: Код Mdm аффилированного лица
          minLength: 1
          maxLength: 40
        isPremium:
          type: boolean
          description: Является ли связка с Премиум условиями
        deeplink:
          type: string
          maxLength: 134
          description: Диплинк на приглашение в Близкий круг
    PrimeInvitationApproveRequestParams:
      type: object
      description: Решение по премиальному приглашению
      additionalProperties: false
      required:
        - externalId
        - decision
      properties:
        externalId:
          type: string
          description: Иденификатор приглашения для внешних систем
          maxLength: 5
        decision:
          type: boolean
    InnerCircleMember:
      type: object
      description: Роль клиента в Близком круге
      additionalProperties: false
      required:
        - isMaster
      properties:
        isMaster:
          type: boolean
          description: Является ли клиент КП
    MasterInFamily:
      type: object
      description: Наличие ключевой персоны в Группе Близкие АЛ
      additionalProperties: false
      required:
        - masterMdmId
        - customerId
        - isFamily
      properties:
        masterMdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        customerId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        isFamily:
          type: boolean
          description: Метка наличия клиента в Группе Близкие
    InvitationInfoRequestParams:
      type: object
      description: Данные приглашения в Близкий круг
      additionalProperties: false
      required:
        - externalId
      properties:
        externalId:
          type: string
          maxLength: 5
          description: Иденификатор приглашения для внешних систем
    CustomerInInnerCircle:
      type: object
      description: Роль клиента в Близком круге пользователя
      additionalProperties: false
      required:
        - isMaster
      properties:
        isMaster:
          type: boolean
          description: Является ли клиент КП
        isInnerCircle:
          type: boolean
          description: Метка наличия клиента в Близком кругу пользователя
    CustomerInInnerCircleRequestParams:
      type: object
      description: >-
        Параметры запроса для получения роли клиента в Близком круге
        пользователя
      additionalProperties: false
      required:
        - mdmId
        - isMasterCheck
        - isAffiliateCheck
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        isMasterCheck:
          type: boolean
          description: Проверка является ли приглашемый КП для пользователя
        isAffiliateCheck:
