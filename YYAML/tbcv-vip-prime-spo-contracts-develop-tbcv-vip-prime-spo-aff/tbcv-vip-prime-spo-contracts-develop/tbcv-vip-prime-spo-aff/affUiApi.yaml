          application/json:
            schema:
              $ref: '#/components/schemas/EncodingRequestParams'
      responses:
        '200':
          description: Данные по клиентам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecodingResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
