    CountInvitationRequestParams:
      type: object
      description: Данные приглашения в Близкий круг
      additionalProperties: false
      required:
        - affInvId
        - masterMdmId
        - totalAff
      properties:
        affInvId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: Иденификатор приглашения
        masterMdmId:
          type: string
          description: Код Mdm ключевой персоны
          maxLength: 40
        totalAff:
          type: integer
          description: Количество аффилированных лиц
          format: int32
          minimum: 0
          maximum: 2147483647
    EncodingRequestParams:
      type: object
      description: Зашифрованный mdmId клиента
      additionalProperties: false
      required:
        - encodedMdmId
      properties:
        encodedMdmId:
          type: string
          description: Зашифрованный Mdm клиента
          maxLength: 512
    DecodingResponseParams:
      type: object
      description: Дешифрованный mdmId клиента
      additionalProperties: false
      required:
        - mdmId
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
    FamiliarCardWidgetsResponseParams:
      type: object
      description: Премиальные виджеты для вывода в карточке близкого
      additionalProperties: false
      required:
        - relativeServices
        - isRelativePreferences
      properties:
        relativeServices:
          $ref: '#/components/schemas/RelativeServicesResponseParams'
        isRelativePreferences:
          type: boolean
          description: Вывод виджета "Поделиться преференциями"
    RelativeServicesResponseParams:
      type: object
      description: Данные для виджета "Премиальные сервисы"
      additionalProperties: false
      required:
        - isRelativeServices
        - isAccess
      properties:
        isRelativeServices:
          type: boolean
          description: Вывод виджета "Премиальные сервисы"
        isAccess:
          type: boolean
          description: >-
            Наличие доступа к премиальным сервисам (true - доступ есть, false -
            доступа нет)