            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/prime/affiliate:
    delete:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: Удаление связки АЛ - КП из семьи Прайм в ВТБО
      operationId: prime_remove_affiliate_vtbo
      parameters:
        - name: affiliateMdmId
          in: query
          required: false
          schema:
            type: string
            description: Код Mdm аффилированного лица
            maxLength: 40
        - name: masterMdmId
          in: query
          required: false
          schema:
            type: string
            description: Код Mdm аффилированного лица
            maxLength: 40
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '204':
          description: Операция завершилась успешно
          content: { }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '404':
          description: Клиент не найден
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/affiliate_invitation/update:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - invitation-change-sofk-controller
      description: Обновление приглашения по данным из топика PersonPub
      operationId: affiliate_invitation_update
      parameters:
        - name: X-Initiator-Service
          in: header
          required: true
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 40
      requestBody:
        description: Параметры запроса для обновления приглашения
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationUpdateRequestParams'
      responses:
        '204':
          description: Приглашение успешно обновлено
          content: { }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '404':
          description: Приглашение не найдено
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/count_invitation/approve/check:
    post:
      security:
        - bearerAuth: [ ]
      tags:
