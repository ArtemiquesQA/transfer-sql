openapi: 3.0.0
info:
  title: 1447.tbcv-affUiApi-s-rest-v1
  version: 1.0.0
  contact:
    name: Кочегарова Оксана Сергеевна
    email: okochegarova@vtb.ru
    url: https://www.vtb.ru
  description: Методы и модели для работы с экранами Близкого круга в ВТБО
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://tbcv-vip-prime-spo-aff.ift01.tbcv.test.vtb.ru/v1
    description: IFT
  - url: https://tbcv-vip-prime-spo-aff.rr01.tbcv.test.vtb.ru/v1
    description: PREPROD
  - url: https://tbcv-vip-prime-spo-aff.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: customer-controller
    description: Методы для работы c клиентскими данными в ВТБО
  - name: inner-circle-controller
    description: Методы для работы экрана Близкого круга ВТБО
  - name: affiliate-invitation-controller
    description: Методы для работы КП с приглашением в Близкий круг ВТБО
  - name: invitation-change-sofk-controller
    description: Методы для обновления данных по приглашению вызываемые из МС СОФК
paths:
  /vtbo/inner_circle/member:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: Определение роли клиента в Близком круге
      operationId: inner_circle_member
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '200':
          description: Роль клиента в Близком круге
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InnerCircleMember'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '422':
          description: У клиента отсутствует Близкий круг
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/affiliate/family/check:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: Для КП проверка наличия аффилированных лиц в Группе Близкие
      operationId: affiliate_family_check
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '200':
          description: mdmId Аффилированных лиц
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiiatesInFamily'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '422':
          description: У клиента отсутствует Близкий круг
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/master/family/check:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: Для АЛ проверка наличия КП в Группе Близкие
      operationId: master_family_check
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '200':
          description: Результаты проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterInFamily'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '422':
          description: У клиента отсутствует Близкий круг
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/inner_circle/check/by_customer:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: >-
        Проверяем является ли близкий АЛ/КП, если АЛ то является ли он АЛ для
        пользователя
      operationId: inner_circle_check_by_customer
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры клиента по которому производится запрос
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInInnerCircleRequestParams'
      responses:
        '200':
          description: Роль клиента в Близком круге пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerInInnerCircle'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '422':
          description: Клиент не состоит в Близком круге
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/customer/by_mdm_id:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-controller
      description: Получить клиента по mdm_id
      operationId: get_customer_by_mdm_id
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры запроса клиентских данных
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequestParams'
      responses:
        '200':
          description: Данные по клиентам
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerInfo'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/customers/by_customer_id:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-controller
      description: Получить клиентов по списку customer_id
      operationId: get_customers_by_customer_id
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Массив customer_id клиентов
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: Список customer_id клиентов
              properties:
                customerIds:
                  type: array
                  description: Массив customer_id клиентов
                  minItems: 1
                  maxItems: 40
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
                    description: ID клиента
      responses:
        '200':
          description: Данные по клиентам
          content:
            application/json:
              schema:
                type: array
                description: Массив клиентов
                minItems: 0
                maxItems: 10
                items:
                  $ref: '#/components/schemas/CustomerInfo'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/count_invitation/check:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - affiliate-invitation-controller
      description: Проверка количества доступных приглашений в Близкий круг
      operationId: count_invitation_check
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountInvitationResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/aff_counter/list:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - affiliate-invitation-controller
      description: Получить матрицу возможных для добавления аффилированных лиц
      operationId: affiliates_counter_list
      responses:
        '200':
          description: Матрица добавления аффилированных лиц
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffilitesCounter'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/inner_circle/check/{affiliate_id}:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: >-
        Проверка аффилированного лица и ключевой персоны перед созданием
        приглашения в Близкий круг
      operationId: inner_circle_check
      parameters:
        - name: affiliate_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
            description: ID клиента
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffiliateCheck'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/affiliate_invitation/add:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - affiliate-invitation-controller
      description: Создание приглашения в Премиальный Близкий круг
      operationId: affiliate_invitation_add
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры создания приглашения
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAddRequestParams'
      responses:
        '200':
          description: Операция завершилась успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationAddResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/affiliate_invitation:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - affiliate-invitation-controller
      description: Получение приглашаемым данных по приглашению в Близкий круг
      operationId: get_affiliate_invitation
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры запроса для получения данных по приглашению
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationInfoRequestParams'
      responses:
        '200':
          description: Данные по приглашению в Близкий круг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInfoResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/prime_invitation/approve:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - affiliate-invitation-controller
      description: >-
        Принятие/отклонение приглашения в Близкий круг при улучшении условий из
        базовых в премиальные
      operationId: affiliate_invitation_approve
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры запроса для принятия/отклонения приглашения в Близкий круг
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimeInvitationApproveRequestParams'
      responses:
        '204':
          description: Решение по приглашению успешно обработано
          content: { }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/customer/servicepack:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-controller
      description: Получить Пакет услуг клиента
      operationId: customer_servicepack
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры клиента по которому производится запрос
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRequestParams'
      responses:
        '200':
          description: Пакет услуг клиента
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePack'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/customer/prospect/check:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-controller
      description: Получить по mdmId клиента наличие метки Проспект
      operationId: customer_prospect
      requestBody:
        description: Параметры запроса списка
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              required:
                - mdmId
              description: Информация по клиенту
              type: object
              properties:
                mdmId:
                  type: string
                  description: Код Mdm клиента
                  maxLength: 40
      responses:
        '200':
          description: Наличие метки Проспект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProspectParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VtboUiErrorDto'
  /vtbo/mdm_id/decoding:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-controller
      description: Дешифровать зашифрованный mdm_id
      operationId: decoding_customer_mdm_id
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры запроса клиентских данных
        required: true
