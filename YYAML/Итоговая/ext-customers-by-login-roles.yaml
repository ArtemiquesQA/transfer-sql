openapi: 3.0.0
info:
  title: 1447.tbcv_getClientsByEmployeeLogin-s-rest-v1
  version: 1.0.0
  description: Методы и модели с API СПО (СОФК)
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: IFT
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: PREPROD
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: customers-by-login-roles-controller
    description: Метод для работы с клиентами сотрудников
paths:
  /ext/customers/by-login-roles:
    post:
      description: Все клиенты сотрудника по ролям
      operationId: post_customers_by_manager_login_roles
      tags:
        - customers-by-login-roles-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Параметры распределения портфеля
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CustomerByLogin"
      responses:
        '200':
          description: Клиенты менеджера
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Customer"
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SofkErrorDto"
        '404':
          description: Менеджер не найден
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SofkErrorDto"
        '422':
          description: У менеджера нет закрепленных за ним клиентов
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SofkErrorDto"
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SofkErrorDto"
components:
  schemas:
    Customer:
      type: object
      description: Описание клиента
      additionalProperties: false
      properties:
        mdm_id:
          type: string
          description: MdmId клиента
          maxLength: 50
          example: '1401382340'
        last_name:
          type: string
          description: Фамилия
          maxLength: 50
          example: Галеева
        first_name:
          type: string
          description: Имя
          maxLength: 50
          example: Ирина
        middle_name:
          type: string
          description: Отчество
          maxLength: 50
          example: Яковлевна
    CustomerByLogin:
      type: object
      description: Получение закреплений за сотрудником по его роли и логину
      required:
        - login
        - roles
      additionalProperties: false
      properties:
        login:
          type: string
          minLength: 0
          maxLength: 50
        roles:
          type: array
          minItems: 1
          maxItems: 2147483647
          items:
            type: string
            enum:
              - PERSONAL_MANAGER
              - PFM
              - PFM2
              - SUPERVISOR
              - SUPERVISOR_PRIME
              - BILL_ACCOUNTANT
              - BILL_ACCOUNTANT_PRIVILEGE
    SofkErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: date-time
          description: Время ответа
          
        status:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          description: URN ответа
          maxLength: 100
          example: "/employee/by-login-roles/12342123"
