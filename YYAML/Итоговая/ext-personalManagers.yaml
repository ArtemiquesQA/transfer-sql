openapi: 3.0.0
info:
  title: 1447.tbcv_sofk-commonApi-s-rest-v1
  version: 1.0.0
  description: Методы и модели для работы с API СОФК
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: personal-managers-controller
    description: Методы работы с персональными менеджерами
paths:
  /ext/personalManagers/{mdmId}:
    get:
      description: Основной и замещающий менеджеры клиента
      operationId: get_personal_managers_by_customer
      tags:
        - personal-managers-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: true
          description: Имя сервиса запрашивающего данные
          schema:
            type: string
            maxLength: 20
        - name: mdmId
          in: path
          required: true
          description: MdmId клиента
          schema:
            type: string
            minLength: 1
            maxLength: 40
      responses:
        "200":
          description: Основной и замещающий менеджер
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmployeeApi'
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "404":
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "422":
          description: Команда обслуживания не назначена/Персональный менеджер не назначен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
components:
  schemas:
    EmployeeApi:
      type: object
      description: Описание сотрудника
      additionalProperties: false
      properties:
        tabnum:
          type: string
          description: Табельный номер
          maxLength: 50
          example: '142552'
        login:
          type: string
          description: Логин
          maxLength: 50
          example: KULOV
        last_name:
          type: string
          description: Фамилия
          maxLength: 50
          example: Марков
        first_name:
          type: string
          description: Имя
          maxLength: 50
          example: Андрей
        middle_name:
          type: string
          description: Отчество
          maxLength: 50
          example: Викторович
        email:
          type: string
          description: Адрес электронной почты сотрудника в команде обслуживания
          maxLength: 50
          example: markov@vtb.ru
        flag_main:
          type: boolean
          description: Флаг основной ПМ
          example: false
        org_id:
          type: string
          description: Номер отделения
          maxLength: 50
          example: '50216613'
        org_name:
          type: string
          description: Имя отделения
          maxLength: 255
          example: РОО Волгоградский
        org_address:
          type: string
          description: Адрес отделения
          maxLength: 255
          example: Волгоград пр-кт. Ленинский, Дом. 11
        org_workhours:
          type: string
          description: Часы работы отделения сотрудника в команде обслуживания
          maxLength: 100
          example: 'пн-пт: 09:00-18:00 сб, вс: выходной'
        org_timezone:
          type: string
          description: Часовой пояс отделения сотрудника в команде обслуживания
          maxLength: 100
          example: 'UTC+3'
        status_id:
          type: integer
          format: int32
          description: Уникальный идентификатор(код) статуса сотрудника в команде обслуживания
          example: 1
          minimum: 1
          maximum: 2
        status:
          type: string
          description: Наименование статуса
          example: работает
          maxLength: 30
        phone_num:
          type: string
          description: Мобильный номер телефона
          maxLength: 15
          example: '+79108008000'
        work_phone_num:
          type: string
          description: Рабочий номер телефона
          maxLength: 15
          example: '+74952255959'
        work_phone_ext:
          type: string
          description: Добавочный номер
          maxLength: 10
          example: '43001'
        workhours:
          type: string
          description: Часы работы сотрудника в команде обслуживания
          maxLength: 100
          example: 'пн-пт: 09:00-18:00 сб, вс: выходной'
        timezone:
          type: string
          description: Часовой пояс сотрудника в команде обслуживания с меткой временной зоны
          maxLength: 10
          example: 'UTC+3'
        remote_manager:
          type: boolean
          description: Признак удалённого менеджера
          example: false
        vip:
          type: boolean
          description: Признак того, что менеджер обслуживает клиента как VIP
          example: false
        top:
          type: boolean
          description: Признак того, что менеджер обслуживает клиента как Top Affluent
          example: false
    SofkErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: 'date-time'
          description: Время ответа
          
        status:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          description: URN ответа
          maxLength: 100
          example: /employee/by-login/12342123