openapi: 3.0.0
info:
  title: 1447.tbcv_sofk-commonApi-s-rest-v1
  version: 1.0.0
  description: Методы и модели для работы с API СОФК
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: supervisors-controller
    description: Методы работы с супервизорами
paths:
  /ext/supervisors:
    get:
      description: Супервизоры в точке продаж и отделении
      operationId: get_supervisors_by_department_or_point_of_sale
      tags:
        - supervisors-controller
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающего данные
          schema:
            type: string
            maxLength: 20
        - name: departmentId
          in: query
          required: false
          description: Department Id сотрудника
          schema:
            type: string
            maxLength: 20
        - name: pos
          in: query
          required: false
          description: Код точки продаж сотрудника
          schema:
            type: string
            maxLength: 50
        - name: page
          in: query
          required: false
          description: Номер страницы
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 2147483647
        - name: pageSize
          in: query
          required: false
          description: Размер страницы
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Список найденных супервизоров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupervisorsList'
        "400":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
        "500":
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkErrorDto'
components:
  schemas:
    SupervisorsList:
      type: object
      description: Информация о найденных супервизорах
      additionalProperties: false
      required:
        - list
        - total
      properties:
        list:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/Supervisor'
        total:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
    Supervisor:
      type: object
      description: Описание супервизора
      additionalProperties: false
      required:
        - tabnum
        - login
        - last_name
        - first_name
        - middle_name
        - departmentHierarchy
        - org_id
        - org_name
        - org_address
        - org_workhours
        - org_timezone
      properties:
        tabnum:
          type: string
          description: Табельный номер
          maxLength: 50
          example: '142552'
        login:
          type: string
          description: Логин
          maxLength: 50
          example: KULOV
        last_name:
          type: string
          description: Фамилия
          maxLength: 50
          example: Марков
        first_name:
          type: string
          description: Имя
          maxLength: 50
          example: Андрей
        middle_name:
          type: string
          description: Отчество
          maxLength: 50
          example: Викторович
        email:
          type: string
          description: Адрес электронной почты сотрудника в команде обслуживания
          maxLength: 50
          example: markov@vtb.ru
        departmentHierarchy:
          type: array
          description: Массив идентификаторов департаментов, к которым принадлежат супервизоры
          maxItems: 2147483647
          items:
            type: string
            maxLength: 20
        org_id:
          type: string
          description: Номер точки продаж
          maxLength: 50
          example: '50216613'
        org_name:
          type: string
          description: Наименование точки продаж
          maxLength: 255
          example: РОО Волгоградский
        org_address:
          type: string
          description: Адрес отделения
          maxLength: 255
          example: Волгоград пр-кт. Ленинский, Дом. 11
        org_workhours:
          type: string
          description: Часы работы отделения
          maxLength: 100
          example: 'пн-пт: 09:00-18:00 сб, вс: выходной'
        org_timezone:
          type: string
          description: Часовой пояс отделения
          maxLength: 100
          example: 'UTC+3'
        phone_num:
          type: string
          description: Мобильный номер телефона
          maxLength: 15
          example: '+79108008000'
        work_phone_num:
          type: string
          description: Рабочий номер телефона
          maxLength: 15
          example: '+74952255959'
        work_phone_ext:
          type: string
          description: Добавочный номер
          maxLength: 10
          example: '43001'
        roles:
          type: array
          description: Роли супервизора
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/ServiceTeamRole'
    ServiceTeamRole:
      type: string
      description: Роль сотрудника в команде обслуживания
      enum:
        - SUPERVISOR
        - SUPERVISOR_PRIME
        - PERSONAL_MANAGER
        - PFM
        - PFM2
        - ACCOUNT_MANAGER
    SofkErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: 'date-time'
          description: Время ответа
          
        status:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          description: URN ответа
          maxLength: 100
          example: /employee/by-login/12342123