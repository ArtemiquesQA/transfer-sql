openapi: 3.0.0
info:
  title: 1447.tbcv-shareUiApi-s-rest-v1
  version: 1.0.0
  contact:
    name: Кочегарова Оксана Сергеевна
    email: okochegarova@vtb.ru
    url: https://www.vtb.ru
  description: Методы и модели для работы с экранами Шеринга в ВТБО
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: preference-controller
    description: Методы для работы с преференциями в ВТБО
paths:
  /share/customer/preferences:
    get:
      security:
        - bearerAuth: []
      tags:
        - preference-controller
      description: Получение общего количества преференций и преференций для дарения
      operationId: preference_total_share
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '200':
          description: Общее количество преференций и преференции для дарения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceCount'
        '204':
          description: Не найдены показатели по известному клиенту
          content: {}
        '401':
          description: Проблема с аутентификацией пользователя
          content: {}
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
  /share/preferences/members:
    get:
      security:
        - bearerAuth: []
      tags:
        - preference-controller
      description: Список клиентов для шеринга преференций
      operationId: preference_share_members
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '200':
          description: Список клиентов для шеринга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrerferenceSharedMembersList'
        '401':
          description: Проблема с аутентификацией пользователя
          content: {}
        '404':
          description: Клиент не найден
          content: {}
        '422':
          description: У клиента отсутствует Группа Близкие
          content: {}
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
  /share/preferences:
    post:
      security:
        - bearerAuth: []
      tags:
        - preference-controller
      description: Дарение преференций аффилированному лицу
      operationId: preference_share
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры запроса для дарения преференций
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareRequestParams'
      responses:
        '204':
          description: Преференции подарены успешно
          content: {}
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: {}
        '404':
          description: Клиент не найден
          content: {}
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
  /share/preferences/members/v2:
    get:
      security:
        - bearerAuth: []
      tags:
        - preference-controller
      description: >-
        Список участников группы Близкие и Близкого круга для шеринга
        преференций
      operationId: preference_share_members_v2
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      responses:
        '200':
          description: Список клиентов для шеринга
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrerferenceSharedAllMembersList'
        '401':
          description: Проблема с аутентификацией пользователя
          content: {}
        '404':
          description: Клиент не найден
          content: {}
        '422':
          description: У клиента отсутствует Группа Близкие
          content: {}
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
  /share/customers/by_mdm_id:
    post:
      security:
        - bearerAuth: []
      tags:
        - customer-controller
      description: Получить ФИО клиентов по массиву mdmId
      operationId: get_customers_by_mdm_id
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Массив mdm id
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareMembersListRequestParams'
      responses:
        '200':
          description: Данные по клиенту
          content:
            application/json:
              schema:
                type: array
                description: Массив клиентов
                minItems: 0
                maxItems: 40
                items:
                  $ref: '#/components/schemas/ShareMembersInfo'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: {}
        '422':
          description: Не состоит в Группе Близкие
          content: {}
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
  /share/customers/servicepack:
    post:
      security:
        - bearerAuth: []
      tags:
        - customer-controller
      description: Получить Пакет услуг по перечню клиентов
      operationId: customers_servicepack
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Параметры запроса ПУ по массиву mdmId клиентов
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicepackRequestParams'
      responses:
        '200':
          description: Пакет услуг по массиву клиентов
          content:
            application/json:
              schema:
                type: array
                description: Массив клиентов
                minItems: 0
                maxItems: 40
                items:
                  $ref: '#/components/schemas/CustomersServicePack'
        '401':
          description: Проблема с аутентификацией пользователя
          content: {}
        '404':
          description: Клиент не найден
          content: {}
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
  /share/customers/by_mdm_id/v2:
    post:
      security:
        - bearerAuth: []
      tags:
        - customer-controller
      description: Получить ФИО клиентов по массиву mdmId после проверок наличия mdm из запроса в Группе Близкие и Близком круге
      operationId: get_customers_by_mdm_id_v2
      parameters:
        - $ref: '#/components/parameters/X-MDM-ID'
      requestBody:
        description: Массив mdm id
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareMembersListRequestParams'
      responses:
        '200':
          description: Данные по клиенту
          content:
            application/json:
              schema:
                type: array
                description: Массив клиентов
                minItems: 0
                maxItems: 40
                items:
                  $ref: '#/components/schemas/ShareMembersInfo'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: {}
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareUiErrorDto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
  parameters:
    X-MDM-ID:
      name: X-MDM-ID
      description: mdmId клиента
      in: header
      required: true
      schema:
        type: string
        maxLength: 40
  schemas:
    ShareUiErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: date-time
          description: Время ответа
          pattern: >-
            ^[0-9]{4}-((0[1-9])|(1[0-2]))-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(()|(.[0-9]{1,6})(Z|([+-](0[0-9]|1[0-2]):([0-5][0-9])))|(.[0-9]{1,6}))|)$
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          maxLength: 100
          description: URN ответа
          example: /api/v1/employee
    PreferenceCount:
      type: object
      description: Количество преференций по одному клиенту
      additionalProperties: false
      properties:
        preferenceTotal:
          type: integer
          description: Общее количество преференций клиента
          format: int32
          minimum: 0
          maximum: 2147483647
        preferenceForShare:
          type: integer
          description: Количество преференций для дарения
          format: int32
          minimum: 0
          maximum: 2147483647
    PrerferenceSharedMembersList:
      type: object
      description: Список клиентов для шеринга преференций
      required:
        - list
      additionalProperties: false
      properties:
        list:
          type: array
          description: Перечень приглашенных в Близкий круг
          maxItems: 200
          items:
            $ref: '#/components/schemas/SharedCustomerInfo'
    SharedCustomerInfo:
      type: object
      description: Описание одного клиента из списка для дарения преференций
      additionalProperties: false
      required:
        - mdmId
        - isPremium
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        isPremium:
          type: boolean
    ShareRequestParams:
      type: object
      description: Параметры запроса для дарения преференций
      additionalProperties: false
      required:
        - affiliateMdmId
        - preferenceCountShare
      properties:
        affiliateMdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        preferenceCountShare:
          description: Количество преференций для дарения
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          example: 1
    ServicepackRequestParams:
      type: object
      description: Параметры запроса пакета услуг по массиву клиентов
      additionalProperties: false
      required:
        - mdmIds
        - isActual
      properties:
        mdmIds:
          type: array
          description: Массив mdm_id клиентов
          minItems: 1
          maxItems: 40
          items:
            type: string
            description: Код Mdm клиента
            maxLength: 40
        isActual:
          description: Получение ПУ из ИС 1503 (true), из СОФК (false)
          type: boolean
    CustomersServicePack:
      type: object
      description: Пакет услуг по массиву клиентов
      additionalProperties: false
      required:
        - mdmId
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        servicePack:
          $ref: '#/components/schemas/ServicePack'
    ServicePack:
      type: object
      description: Пакет услуг
      additionalProperties: false
      properties:
        name:
          type: string
          description: Наименование пакета услуг
          maxLength: 50
        type:
          $ref: '#/components/schemas/ServicePackType'
    ServicePackType:
      type: string
      description: Типы пакетов услуг
      enum:
        - UNKNOWN
        - PRIME
        - RETAIL
        - PRIVILEGE
    ShareMembersListRequestParams:
      type: object
      description: Запрос ФИО клиентов по списку mdmId
      additionalProperties: false
      required:
        - list
      properties:
        list:
          type: array
          description: Список mdmId клиентов с идентификаторами для сортировки
          maxItems: 2147483647
          items:
            $ref: '#/components/schemas/ShareMembersId'
    ShareMembersId:
      type: object
      description: Список mdmId клиентов с идентификаторами для сортировки
      additionalProperties: false
      required:
        - orderId
        - mdmId
      properties:
        orderId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
    ShareMembersInfo:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      required:
        - orderId
        - lastName
        - firstName
      properties:
        orderId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
    PrerferenceSharedAllMembersList:
      type: object
      description: >-
        Список участников группы Близкие и Близкого круга для шеринга
        преференций
      required:
        - allowedSharedlist
        - unAllowedSharedlist
      additionalProperties: false
      properties:
        allowedSharedlist:
          type: array
          description: Список mdmId разрешенных для дарения преференций
          minItems: 1
          maxItems: 20
          items:
            type: string
            description: Код Mdm клиента
            maxLength: 40
        unAllowedSharedlist:
          type: array
          description: Список mdmId неразрешенных для дарения преференций
          minItems: 1
          maxItems: 20
          items:
            type: string
            description: Код Mdm клиента
            maxLength: 40
