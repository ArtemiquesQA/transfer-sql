openapi: 3.0.0
info:
  title: 1447.tbcv-sofkAffApi-s-rest-v1
  version: 1.0.0
  contact:
    name: Кочегарова Оксана Сергеевна
    email: okochegarova@vtb.ru
    url: https://www.vtb.ru
  description: Методы и модели для работы с экранами Близкого круга в ВТБО
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: customer-vtbo-controller
    description: Методы для работы c клиентскими данными
  - name: inner-circle-controller
    description: Методы для работы с Близким кругом
  - name: inner-circle-check-controller
    description: Методы для проверок Близкого круга
paths:
  /vtbo/sofk/customer/get:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-vtbo-controller
      description: Получить данные клиента по его mdmId/customerId
      operationId: get_customer_by_params
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: id или mdmId клиента
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Данные по клиенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerInfo'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/customers/by_id:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-vtbo-controller
      description: Получить id клиентов по mdm_id или customerId
      operationId: get_customer_id_by_id
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Массив id
        required: true
        content:
          application/json:
            schema:
              description: Список id клиентов
              properties:
                mdmId:
                  type: array
                  description: Массив mdm_id клиентов
                  minItems: 1
                  maxItems: 40
                  items:
                    type: string
                    description: Код Mdm клиента
                    maxLength: 40
                customerIds:
                  type: array
                  description: Массив customerId клиентов
                  minItems: 1
                  maxItems: 40
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
                    description: ID клиента
      responses:
        '200':
          description: Id клиентов
          content:
            application/json:
              schema:
                type: array
                description: Массив клиентов
                minItems: 0
                maxItems: 40
                items:
                  $ref: '#/components/schemas/CustomerIdResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/customers/by_customer_id:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-vtbo-controller
      description: Получить ФИО клиентов по массиву customerId
      operationId: get_customer_id_by_customer_id
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Массив id
        required: true
        content:
          application/json:
            schema:
              description: Список id клиентов
              properties:
                customerIds:
                  type: array
                  description: Массив customerId клиентов
                  minItems: 1
                  maxItems: 40
                  items:
                    type: integer
                    format: int64
                    minimum: 1
                    maximum: 9223372036854775807
                    description: ID клиента
      responses:
        '200':
          description: Id клиентов
          content:
            application/json:
              schema:
                type: array
                description: Массив клиентов
                minItems: 0
                maxItems: 40
                items:
                  $ref: '#/components/schemas/CustomerInfo'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/inner_circle/member/{mdm_id}:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: Определение роли клиента в Близком круге
      operationId: inner_circle_member
      parameters:
        - name: mdm_id
          in: path
          required: true
          schema:
            type: string
            description: Код Mdm клиента
            maxLength: 40
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Роль клиента в Близком круге
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InnerCircleMember'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '422':
          description: У клиента отсутствует Близкий круг
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/inner_circle:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: >-
        Получение id аффилированных лиц/ключевой персоны в зависимости от роли
        клиента в Близком кругу в запросе метода
      operationId: get_inner_circle_id
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: id аффилированного лица/ключевой персоны
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InnerCircleMemberRequestParams'
      responses:
        '200':
          description: id аффилированных лиц/ключевой персоны
          content:
            application/json:
              schema:
                type: array
                description: Массив клиентов
                minItems: 0
                maxItems: 10
                items:
                  $ref: '#/components/schemas/CustomerIdResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '422':
          description: У клиента отсутствует Близкий круг
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/count_affiliates/{mdm_id}:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: Количество аффилированных лиц ключевой персоны
      operationId: count_affiliates
      parameters:
        - name: mdm_id
          in: path
          required: true
          schema:
            type: string
            description: Код Mdm клиента
            maxLength: 40
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      responses:
        '200':
          description: Результат проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AffCount'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '422':
          description: Аффилированные лица не найдены
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/customer/add:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - customer-vtbo-controller
      description: >-
        Поиск и добавление аффилированного лица в таблицу customer для создания
        приглашения в БК
      operationId: сustomer_add
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Параметры запроса списка
        required: true
        content:
          application/json:
            schema:
              required:
                - mdmId
              description: Информация по клиенту
              properties:
                mdmId:
                  type: string
                  description: Код Mdm клиента
                  maxLength: 40
      responses:
        '200':
          description: Данные по клиенту
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerIdResponseParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/inner_circle/check:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-check-controller
      description: Проверка АЛ и КП перед созданием приглашения в Близкий круг
      operationId: inner_circle_check
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: АЛ и КП по приглашению в Близкий круг
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateAddRequestParams'
      responses:
        '204':
          description: Проверка пройдена
          content: { }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/affiliate/check:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-check-controller
      description: Проверка наличия связи АЛ с КП
      operationId: affiliate_check
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Параметры запроса для проверки связи АЛ с КП
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateCheckRequestParams'
      responses:
        '204':
          description: Проверка пройдена
          content: { }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/prime/affiliate/add:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: Добавление аффилированного лица в Близкий круг
      operationId: affiliate_prime_add
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: АЛ и КП по приглашению в Близкий круг
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AffiliateAddRequestParams'
      responses:
        '204':
          description: Операция завершилась успешно
          content: { }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/prime/affiliate:
    delete:
      security:
        - bearerAuth: [ ]
      tags:
        - inner-circle-controller
      description: Удаление связки АЛ - КП из семьи Прайм в ВТБО
      operationId: prime_remove_affiliate_vtbo
      parameters:
        - name: masterMdmId
          in: query
          required: true
          schema:
            type: string
            description: Код Mdm клиента
            maxLength: 40
        - name: affiliateMdmId
          in: query
          required: true
          schema:
            type: string
            description: Код Mdm клиента
            maxLength: 40
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      responses:
        '204':
          description: Операция завершилась успешно
          content: { }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/prospect/check/{mdm_id}:
    get:
      security:
        - bearerAuth: []
      tags:
        - customer-vtbo-controller
      description: Получить по mdmId клиента наличие метки Проспект
      operationId: customer_prospect
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
        - name: mdm_id
          in: path
          required: true
          schema:
            type: string
            description: Код Mdm клиента
            maxLength: 40
      responses:
        '200':
          description: Наличие метки Проспект
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProspectParams'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/affiliate_invitation/create:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - affiliate-invitation-controller
      description: Добавление нового приглашения
      operationId: affiliate_invitation_add
      parameters:
        - name: Initiator-Service
          in: header
          required: false
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 20
      requestBody:
        description: Данные по приглашению в Близкий круг и Группу Близкие
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAddRequestParams'
      responses:
        '204':
          description: Операция завершилась успешно
          content: { }
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /vtbo/sofk/inner_circle/members:
    post:
      security:
        - bearerAuth: [ ]
      description: >-
        Определение роли текущего клиента и близкого в Близком круге текущего
        пользователя
      operationId: inner_circle_members
      tags:
        - inner-circle-controller
      parameters:
        - name: X-Initiator-Service
          in: header
          required: true
          description: Имя сервиса запрашивающий данные
          schema:
            type: string
            maxLength: 40
      requestBody:
        description: mdmId клиентов по которым определяем роли в Близком круге
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InnerCircleMembersRequestParams'
      responses:
        '200':
          description: >-
            Роли текущего клиента и близкого в Близком круге текущего
            пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InnerCircleMembers'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
  schemas:
    SofkUiErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: date-time
          description: Время ответа
          pattern: >-
            ^[0-9]{4}-((0[1-9])|(1[0-2]))-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}(()|(.[0-9]{1,6})(Z|([+-](0[0-9]|1[0-2]):([0-5][0-9])))|(.[0-9]{1,6}))|)$
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          maxLength: 100
          description: URN ответа
          example: /api/v1/employee
    CustomerInfo:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      required:
        - lastName
        - firstName
      properties:
        customerId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
    CustomerIdResponseParams:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      required:
        - mdmId
        - customerId
      properties:
        customerId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
    CustomerRequest:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      properties:
        customerId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
    AffCount:
      type: object
      description: Количество аффилированных лиц клиента
      additionalProperties: false
      properties:
        totalAff:
          type: integer
          description: Количество аффилированных лиц
          format: int32
          minimum: 0
          maximum: 2147483647
    AffiliateAddRequestParams:
      type: object
      description: АЛ и КП по приглашению в Близкий круг
      required:
        - masterId
        - affiliateId
      additionalProperties: false
      properties:
        masterId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        affiliateId:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          description: ID клиента
        relativeId:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: ID катгории родства
    AffiliateCheckRequestParams:
      type: object
      description: АЛ и КП по связке в Близком кругу
      required:
        - masterMdmId
        - affiliateMdmId
      additionalProperties: false
      properties:
        masterMdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        affiliateMdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
    InnerCircleMember:
      type: object
      description: Роль клиента в Близком круге
      additionalProperties: false
      required:
        - isMaster
      properties:
        isMaster:
          type: boolean
    InnerCircleMemberRequestParams:
      type: object
      description: mdmId по роли клиента в Близком круге
      additionalProperties: false
      properties:
