openapi: 3.0.0
info:
  title: 1447.tbcv_AdminConsoleSpo-s-rest-v1
  version: 1.0.0
  contact:
    name: Кочегарова Оксана Сергеевна
    email: okochegarova@vtb.ru
    url: https://www.vtb.ru
  description: Методы и модели для работы с экранами СОФК
servers:
  - url: https://vip-prime-sofk.apps.ds1-genr01.corp.dev.vtb/v1
    description: DSO
  - url: https://vip-prime-sofk.k3-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K3
  - url: https://vip-prime-sofk.k4-vip-prime.apps.ss1-genr01.test.vtb.ru/v1
    description: K4
  - url: https://vip-prime-sofk.tbcv.region.vtb.ru/v1
    description: PROD
tags:
  - name: console-controller
    description: Методы для работы группой обслуживания в Консоли Управления
paths:
  /int/console/client/{mdmId}:
    get:
      security:
        - bearerAuth: [ ]
      tags:
        - console-controller
      description: Получить данные клиента по mdmId для вывода в Консоли Управления
      operationId: get_client_by_mdm_id
      parameters:
        - name: mdmId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 40
            example: '321456211'
            description: mdm_id клиента
      responses:
        '200':
          description: Информация о клиенте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrimeClientInfo'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /int/console/group/list:
    get:
      security:
        - bearerAuth: [ ]
      description: Список групп обслуживания для Консоли управления
      operationId: console_group_list
      tags:
        - console-controller
      responses:
        '200':
          description: Список групп обслуживания для Консоли управления
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/GroupPrime'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
  /int/console/group:
    post:
      security:
        - bearerAuth: [ ]
      tags:
        - console-controller
      description: Изменение группы обслуживания
      operationId: console_set_group
      requestBody:
        description: Параметры смены группы обслуживания
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceGroupUpdateRequestParams'
      responses:
        '200':
          description: Операция завершилась успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultState'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
        '401':
          description: Проблема с аутентификацией пользователя
          content: { }
        '404':
          description: Клиент не найден
          content: { }
        '500':
          description: Неизвестная ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SofkUiErrorDto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
  schemas:
    PrimeClientInfo:
      type: object
      description: Запись о клиенте
      required:
        - customer
        - servicePack
        - isVip
        - serviceGroup
      additionalProperties: false
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        servicePack:
          $ref: '#/components/schemas/ServicePack'
        isVip:
          type: boolean
          description: Метка VIP
        serviceGroup:
          $ref: '#/components/schemas/GroupPrime'
    Customer:
      type: object
      description: Описание одного клиента
      additionalProperties: false
      required:
        - mdmid
        - lastName
        - firstName
        - middleName
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        lastName:
          type: string
          maxLength: 50
        firstName:
          type: string
          maxLength: 50
        middleName:
          type: string
          maxLength: 50
    ServicePack:
      type: object
      description: Пакет услуг
      additionalProperties: false
      properties:
        name:
          type: string
          description: Наименование пакета услуг
          maxLength: 50
        type:
          $ref: '#/components/schemas/ServicePackType'
    ServicePackType:
      type: string
      description: Типы пакетов услуг
      enum:
        - UNKNOWN
        - PRIME
        - RETAIL
        - PRIVILEGE
    GroupPrime:
      type: object
      description: Группа обслуживания клиентов Прайм
      required:
        - kind
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        kind:
          $ref: '#/components/schemas/GroupPrimeKind'
    GroupPrimeKind:
      type: string
      description: Тип групп обслуживания клиентов Прайм
      enum:
        - PRIME
        - AFFILIATE
        - TEMPORARY_AGREEMENT
        - TOP_AFFLUENT
        - ELSE
        - UNASSIGNED
    SofkUiErrorDto:
      type: object
      description: Ошибки при выполнении запроса
      additionalProperties: false
      properties:
        time:
          type: string
          format: date-time
          description: Время ответа
        status:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
          description: Код ответа
        error:
          type: string
          maxLength: 255
          description: Причина ошибки
        message:
          type: string
          maxLength: 255
          description: Сообщение ошибки
        path:
          type: string
          maxLength: 100
          description: URN ответа
          example: /api/v1/employee
    ServiceGroupUpdateRequestParams:
      type: object
      description: Параметры изменения группы обслуживания клиента Прайм
      required:
        - mdmId
        - group
      additionalProperties: false
      properties:
        mdmId:
          type: string
          description: Код Mdm клиента
          maxLength: 40
        group:
          $ref: '#/components/schemas/GroupPrime'
    ResultState:
      type: object
      description: Статус выполнения запроса
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
            - ok
            - fail
        message:
          type: string
          maxLength: 50